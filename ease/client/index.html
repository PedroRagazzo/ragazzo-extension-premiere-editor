<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Suavizar movimento</title>
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <header>
        <div class="brand">
            <img class="brand-mark" src="assets/motionease-favicon.svg" alt="Suavizar" width="20" height="20">
            <span class="brand-name">Suavizar movimento</span>
        </div>
        <div class="clip-line">
            <span id="clipName">nenhum clipe</span>
            <button id="refresh" title="Reler o clipe selecionado">⟳</button>
        </div>
    </header>

    <section id="properties">
        <div id="treeBar">
            <label class="check-all" title="Marcar todas as propriedades listadas">
                <input type="checkbox" id="checkAll"> Todas
            </label>
            <input id="propSearch" class="hidden" type="text" placeholder="filtrar…" spellcheck="false">
        </div>
        <div id="propTree"></div>
    </section>
    <div class="splitter" id="splitTree" title="Arraste para redimensionar"></div>

    <section id="strip-section" class="hidden">
        <div id="kfStrip"></div>
        <div id="kfStripInfo" class="hint"></div>
    </section>

    <section id="graph-section">
        <div class="graph-toolbar">
            <button id="modeValue" class="seg active">Valor</button>
            <button id="modeSpeed" class="seg">Velocidade</button>
            <span class="hint" style="margin-left:auto">2×clique na curva: adiciona ponto · 2×clique no ponto: remove · ⇧: sem imã</span>
        </div>
        <canvas id="graph"></canvas>
        <div class="readouts">
            <label>Saída infl %<input id="inflOut" type="number" step="0.1" min="0.1" max="100"></label>
            <label>Saída veloc.<input id="spdOut" type="number" step="0.05"></label>
            <label>Entrada infl %<input id="inflIn" type="number" step="0.1" min="0.1" max="100"></label>
            <label>Entrada veloc.<input id="spdIn" type="number" step="0.05"></label>
        </div>
    </section>
    <div class="splitter" id="splitGraph" title="Arraste para redimensionar"></div>

    <section id="presets-section">
        <div class="presets-head">
            <span>Presets</span>
            <span class="presets-actions">
                <button id="presetMine" title="Mostrar só os presets que você salvou">Meus</button>
                <button id="presetSave" title="Salvar a curva atual como preset">＋ Salvar</button>
                <button id="presetImport" title="Importar preset ou biblioteca (.easify/.json)">Importar</button>
                <button id="presetExport" title="Exportar a biblioteca inteira">Exportar</button>
            </span>
        </div>
        <div id="presetGrid"></div>
    </section>

    <section id="apply-section">
        <div class="apply-row">
            <button id="apply" class="primary">Aplicar</button>
            <button id="revert" title="Restaurar os keyframes de antes do último Aplicar">Desfazer</button>
        </div>
        <div id="status" class="status">carregando…</div>
    </section>

    <!-- iframe embutido no plugin EP: o __adobe_cep__ (ponte CEP) fica na janela PAI. Empresta pro iframe ANTES do
         CSInterface, senão o evalScript do sub-app não fala com o Premiere. -->
    <script>
      (function () {
        try {
          if (!window.__adobe_cep__ && window.parent && window.parent.__adobe_cep__) {
            window.__adobe_cep__ = window.parent.__adobe_cep__;
          }
          if (!window.cep_node && window.parent && window.parent.cep_node) { window.cep_node = window.parent.cep_node; }
          if (typeof window.cep === 'undefined' && window.parent && typeof window.parent.cep !== 'undefined') { window.cep = window.parent.cep; }
        } catch (e) {}
      })();
    </script>
    <script src="lib/CSInterface.js"></script>
    <script src="../shared/curves.js"></script>
    <script src="js/host-bridge.js"></script>
    <script src="js/graph.js"></script>
    <script src="js/presets.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
